name: ARC runner smoke

on:
  push:
    paths:
      - .github/workflows/arc-runner-smoke.yaml

permissions:
  contents: read

jobs:
  smoke:
    runs-on: arc-large
    steps:
      - name: Report runner platform
        shell: bash
        run: |
          set -euo pipefail
          printf 'runner=%s\n' "${RUNNER_NAME:-unknown}"
          uname -srm
          if command -v nix >/dev/null 2>&1; then
            nix --version
          else
            echo 'nix is not preinstalled on this ARC runner'
          fi
